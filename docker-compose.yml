services:
  labsync-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: labsync-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=labsync_super_secure_jwt_secret_key_2026_production
      - SPREADSHEET_ID=1swE1x8y7xNFaPFZovR9BJ6usq7baM3gGkXqNI8cgWmI
      # Google Sheets is the single durable database — no local db fallback.
      # GOOGLE_CREDENTIALS must be provided (service-account JSON content).
      - GOOGLE_CREDENTIALS=${GOOGLE_CREDENTIALS}
      - FACE_DETECT_BUDGET_MS=4500
      - ENFORCE_DEVICE_AUTH=true
      - REQUIRE_DEVICE_AUTH=true
    volumes:
      - ./backend/logs:/app/logs

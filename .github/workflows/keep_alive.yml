name: Keep GCP Cloud Run Backend Awake

on:
  schedule:
    # Run every 10 minutes to prevent Cloud Run cold starts
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping LabSync GCP Cloud Run Backend
        run: |
          echo "Pinging LabSync GCP backend at $(date)..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://labsync-460952407297.asia-south1.run.app/api/wake || echo "FAILED")
          echo "Keep-alive ping returned status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ LabSync GCP backend is warm and active."
          else
            echo "⚠️ Non-200 response received ($HTTP_STATUS)."
          fi

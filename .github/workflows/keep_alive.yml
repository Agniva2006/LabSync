name: Keep Render Backend Awake

on:
  schedule:
    # Run every 10 minutes to prevent Render free instance from idling
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping LabSync Render Backend
        run: |
          echo "Pinging LabSync backend at $(date)..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://labsync-pnr8.onrender.com/api/wake || echo "FAILED")
          echo "Keep-alive ping returned status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ LabSync backend is warm and active."
          else
            echo "⚠️ Non-200 response received ($HTTP_STATUS)."
          fi

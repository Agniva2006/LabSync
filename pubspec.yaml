name: labsync
description: Smart Laboratory Asset Tracking System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  
  # UI & Animations
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  flutter_animate: ^4.5.0
  cupertino_icons: ^1.0.8
  
  # Hardware & Scanning
  mobile_scanner: ^6.0.2    
  camera: ^0.12.0+1
  image_picker: ^1.2.3
  
  # Networking & Data
  http: ^1.2.1
  http_parser: ^4.0.2
  file_picker: ^8.1.2       
  csv: ^5.1.1
  
  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.5.5
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/iit_kgp_profile.png

# App Icon Configuration
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/iit_kgp_profile.png"
  adaptive_icon_background: "#0A0E27"
  adaptive_icon_foreground: "assets/images/iit_kgp_profile.png"